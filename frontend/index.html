<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Todo</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Let Tailwind's dark: classes respond to the .dark class on <html>
      tailwind.config = { darkMode: "class" };
    </script>
  </head>
  <body
    class="min-h-screen bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200"
  >
    <div class="max-w-xl mx-auto px-4 py-10">
      <header class="flex items-center justify-between mb-8">
        <h1 class="text-2xl font-bold">My Todos 📋</h1>
        <button
          type="button"
          id="themeToggle"
          class="theme-toggle w-10 h-10 flex items-center justify-center rounded-full border border-gray-300 dark:border-gray-600 hover:bg-gray-200 dark:hover:bg-gray-700 transition"
          aria-label="Toggle dark mode"
        >
          <span id="themeIcon">🌙</span>
        </button>
      </header>

      <div class="flex gap-6 mb-6 text-sm font-medium">
        <p>Total Tasks 🔢: <span id="counter" class="font-bold">0</span></p>
        <p>Completed: <span id="completedCounter" class="font-bold">0</span></p>
      </div>

      <div class="flex gap-2 mb-4">
        <input
          type="text"
          id="myInput"
          placeholder="Your upcoming tasks"
          class="flex-1 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400 dark:placeholder-gray-500"
        />
        <button
          type="button"
          onclick="add()"
          class="bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition"
        >
          Add task
        </button>
      </div>

      <div class="flex justify-end mb-6">
        <button
          type="button"
          onclick="clearAll()"
          class="text-sm text-red-500 hover:text-red-700 dark:hover:text-red-400 transition"
        >
          Delete All
        </button>
      </div>

      <ul id="myTasksList" class="space-y-2"></ul>

      <hr class="my-8 border-gray-200 dark:border-gray-700" />
      <p class="text-center text-sm text-gray-500 dark:text-gray-400">
        Made by Astitva with 💗
      </p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
